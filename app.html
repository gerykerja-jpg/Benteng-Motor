<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0ea5e9">
  <meta name="description" content="Aplikasi manajemen jual-beli mobil Benteng Motor">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Benteng Motor">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>Benteng Motor</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0b1220; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    #appFrame { width: 100%; height: 100%; border: 0; display: block; background: #0b1220; }
    #splash {
      position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
      background: radial-gradient(circle at top, #1e3a8a 0, #0b1220 52%, #060b14 100%);
      transition: opacity .25s ease, visibility .25s ease;
    }
    #splash.hide { opacity: 0; visibility: hidden; }
    .splash-card { text-align: center; color: #fff; padding: 24px; }
    .logo {
      width: 92px; height: 92px; margin: 0 auto 16px; border-radius: 24px;
      display: grid; place-items: center; font-size: 46px;
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      box-shadow: 0 18px 50px rgba(14,165,233,.35);
    }
    .splash-card h1 { margin: 0; font-size: 25px; }
    .splash-card p { margin: 7px 0 18px; color: #a9b8ce; font-size: 13px; }
    .loader { width: 46px; height: 4px; margin: auto; border-radius: 99px; overflow: hidden; background: #26334d; }
    .loader::after { content: ""; display: block; height: 100%; width: 45%; border-radius: inherit; background: #38bdf8; animation: load 1s infinite ease-in-out; }
    @keyframes load { from { transform: translateX(-110%); } to { transform: translateX(230%); } }
    #installBtn {
      position: fixed; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 20;
      border: 0; border-radius: 999px; padding: 12px 17px; font-weight: 800; color: #fff;
      background: linear-gradient(120deg, #0ea5e9, #6366f1); box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    #installBtn[hidden] { display: none; }
    #status {
      position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 30;
      transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
      color: #fff; background: #1f2937; border: 1px solid #374151; border-radius: 11px;
      padding: 10px 14px; font-size: 12px; font-weight: 700; transition: .2s;
    }
    #status.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <div id="splash">
    <div class="splash-card">
      <div class="logo">🚗</div>
      <h1>Benteng Motor</h1>
      <p>Menyiapkan aplikasi MobilKu…</p>
      <div class="loader"></div>
    </div>
  </div>

  <iframe id="appFrame" src="./index.html" title="Aplikasi Benteng Motor"></iframe>
  <button id="installBtn" type="button" hidden>⬇ Pasang Aplikasi</button>
  <div id="status" role="status" aria-live="polite"></div>

  <script>
    const splash = document.getElementById('splash');
    const frame = document.getElementById('appFrame');
    const installBtn = document.getElementById('installBtn');
    const statusBox = document.getElementById('status');
    let installPrompt = null;

    frame.addEventListener('load', () => setTimeout(() => splash.classList.add('hide'), 250));
    setTimeout(() => splash.classList.add('hide'), 5000);

    function showStatus(message) {
      statusBox.textContent = message;
      statusBox.classList.add('show');
      clearTimeout(showStatus.timer);
      showStatus.timer = setTimeout(() => statusBox.classList.remove('show'), 2600);
    }

    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      installPrompt = event;
      installBtn.hidden = false;
    });

    installBtn.addEventListener('click', async () => {
      if (!installPrompt) return;
      installPrompt.prompt();
      await installPrompt.userChoice;
      installPrompt = null;
      installBtn.hidden = true;
    });

    window.addEventListener('appinstalled', () => {
      installBtn.hidden = true;
      showStatus('Aplikasi berhasil dipasang');
    });

    window.addEventListener('offline', () => showStatus('Mode offline aktif'));
    window.addEventListener('online', () => showStatus('Koneksi kembali online'));

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {
          showStatus('Penyimpanan offline belum aktif');
        });
      });
    }
  </script>
</body>
</html>
